<div class="admin-login">
  <form class="admin-login__card" (ngSubmit)="submit()">
    <h1 class="admin-login__title">Admin sign in</h1>
    <p class="admin-login__subtitle">Manage orders and update their status.</p>

    <label class="admin-login__field">
      <span>Email</span>
      <input
        type="email"
        name="email"
        autocomplete="username"
        [(ngModel)]="email"
        [disabled]="loading()"
        required
      />
    </label>

    <label class="admin-login__field">
      <span>Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        [disabled]="loading()"
        required
      />
    </label>

    @if (error()) {
      <p class="admin-login__error">{{ error() }}</p>
    }

    <button type="submit" class="admin-login__submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
